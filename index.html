<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Hero Mission: The Healthy Choice</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary-blue: rgb(79, 70, 229);
  --primary-yellow: rgb(253, 224, 71);
  --soft-white: rgb(255, 255, 255);
  --base-unit: 1vmin;
}
body {
  font-family: 'Nunito', sans-serif;
  background: var(--primary-blue);
  height: 100dvh;
  margin: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.header-font, .btn-font { 
  font-family: 'Fredoka One', cursive; 
  letter-spacing: 0.05em;
}
.card-shadow { box-shadow: 0 calc(var(--base-unit) * 1.5) 0px rgba(0, 0, 0, 0.2); }
.choice-btn { 
  transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
  touch-action: manipulation; 
  background-color: var(--primary-blue); 
  color: white !important;
  border-bottom: calc(var(--base-unit) * 1.2) solid rgb(49, 46, 129);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.choice-btn:active { transform: translateY(0.5vh); border-bottom-width: 2px; }

.game-container {
  width: 100vw;
  height: 100dvh;
  padding: calc(var(--base-unit) * 5); 
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  box-sizing: border-box;
}

.hidden { display: none !important; }

.mission-card {
  background: white;
  border: calc(var(--base-unit) * 1.2) solid var(--primary-yellow);
  border-radius: calc(var(--base-unit) * 7);
  padding: calc(var(--base-unit) * 5);
  height: 100%;
  width: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  overflow: hidden;
  box-sizing: border-box;
}

.title-text { font-size: calc(var(--base-unit) * 10); line-height: 1; }
.body-text { font-size: calc(var(--base-unit) * 4); line-height: 1.4; }
.q-text { font-size: calc(var(--base-unit) * 6); line-height: 1.2; font-weight: 900; }
.btn-text { font-size: calc(var(--base-unit) * 4.5); padding: calc(var(--base-unit) * 2.5) calc(var(--base-unit) * 8); border-radius: calc(var(--base-unit) * 12); }
.emoji-size { font-size: calc(var(--base-unit) * 22); line-height: 1; }
.icon-btn-size { width: calc(var(--base-unit) * 9); height: calc(var(--base-unit) * 9); }

.custom-scrollbar::-webkit-scrollbar { width: 6px; }
.custom-scrollbar::-webkit-scrollbar-thumb { background: var(--primary-yellow); border-radius: 10px; }

@media (orientation: landscape) {
  .landscape-row { display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 6vw; width: 100%; flex: 1; min-height: 0; }
  .landscape-emoji { font-size: calc(var(--base-unit) * 30) !important; flex-shrink: 0; }
  .landscape-stack { display: flex; flex-direction: column; justify-content: center; flex: 1; }
  .landscape-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 3vh !important; }
}

.floating { animation: floating 3s ease-in-out infinite; }
@keyframes floating {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(calc(var(--base-unit) * -3)); }
}
</style>
</head>
<body>

<div class="fixed top-6 right-6 z-50 flex gap-4">
  <button onclick="toggleFullScreen()" class="bg-white p-3 rounded-full shadow-lg hover:bg-yellow-100 transition-colors">
    <svg class="icon-btn-size" fill="rgb(79, 70, 229)" viewBox="0 0 256 256"><path d="M160,48a8,8,0,0,1,8-8h40a8,8,0,0,1,8,8V88a8,8,0,0,1-16,0V56H168A8,8,0,0,1,160,48ZM88,200H48V168a8,8,0,0,0-16,0v40a8,8,0,0,0,8,8H88a8,8,0,0,0,0-16Zm128-40a8,8,0,0,0-8,8v32H176a8,8,0,0,0,0,16h40a8,8,0,0,0,8-8V168A8,8,0,0,0,216,160ZM48,96a8,8,0,0,0,8-8V56H88a8,8,0,0,0,0-16H48a8,8,0,0,0-8,8V88A8,8,0,0,0,48,96Z"></path></svg>
  </button>
</div>

<div class="fixed bottom-6 right-6 z-50">
  <button onclick="handleResetClick()" class="bg-white p-3 rounded-full shadow-lg hover:bg-yellow-100 transition-colors flex items-center justify-center border-4 border-yellow-400">
    <svg class="icon-btn-size" fill="rgb(79, 70, 229)" viewBox="0 0 256 256"><path d="M224,115.55V208a16,16,0,0,1-16,16H168a16,16,0,0,1-16-16V168a8,8,0,0,0-8-8H112a8,8,0,0,0-8,8v40a16,16,0,0,1-16,16H48a16,16,0,0,1-16-16V115.55a16,16,0,0,1,5.17-11.78l80-75.48a16,16,0,0,1,21.66,0l80,75.48A16,16,0,0,1,224,115.55Z"></path></svg>
  </button>
</div>

<div class="game-container">
  <div id="start-screen" class="mission-card card-shadow">
    <div class="landscape-row">
      <div class="emoji-size floating landscape-emoji">🦸‍♂️</div>
      <div class="landscape-stack items-center landscape:items-start">
        <h1 class="header-font text-indigo-600 uppercase title-text mb-6">HERO MISSION</h1>
        <p class="text-gray-600 font-bold body-text text-center landscape:text-left mb-10">10 Random Challenges inside!<br> Protect your brain and stay safe.</p>
        <button onclick="handleStartClick()" class="btn-font bg-indigo-600 text-white uppercase shadow-xl btn-text">START MISSION</button>
      </div>
    </div>
  </div>

  <div id="question-screen" class="hidden mission-card card-shadow">
    <div class="w-full flex justify-between items-center gap-6 mb-4">
      <span id="progress-text" class="text-indigo-600 font-black uppercase whitespace-nowrap body-text">Mission 1/10</span>
      <div class="flex-1 bg-gray-200 h-5 rounded-full overflow-hidden border-2 border-gray-100">
        <div id="progress-bar" class="bg-indigo-500 h-full transition-all duration-500 w-[10%]"></div>
      </div>
    </div>
    
    <div class="landscape-row">
      <div id="q-emoji" class="emoji-size landscape-emoji mb-4 landscape:mb-0">🤔</div>
      <div class="landscape-stack w-full">
        <h2 id="question-text" class="text-gray-800 q-text text-center landscape:text-left mb-8">Loading...</h2>
        <div id="options-grid" class="grid grid-cols-1 landscape-grid gap-6 w-full">
          <button onclick="handleAnswerClick(0)" id="btn-0" class="choice-btn btn-font btn-text uppercase">Option A</button>
          <button onclick="handleAnswerClick(1)" id="btn-1" class="choice-btn btn-font btn-text uppercase">Option B</button>
        </div>
      </div>
    </div>
  </div>

  <div id="end-screen" class="hidden mission-card card-shadow">
    <div class="landscape-row flex-shrink-0">
      <div id="end-emoji" class="emoji-size landscape-emoji">🏆</div>
      <div class="landscape-stack items-center landscape:items-start">
        <h1 class="header-font text-indigo-600 uppercase title-text">MISSION COMPLETE</h1>
        <p class="text-gray-600 font-bold q-text mt-2">Score: <span id="final-score" class="text-indigo-600">0</span>/10</p>
      </div>
    </div>
    
    <div class="bg-indigo-50 p-6 rounded-[2.5rem] border-4 border-dashed border-yellow-400 w-full max-w-5xl mx-auto overflow-y-auto custom-scrollbar flex-1 my-6 flex flex-col justify-center min-h-0">
      <div class="header-font text-indigo-800 mb-2 uppercase text-center body-text">Final Report:</div>
      <p id="dynamic-advice" class="text-gray-700 font-bold text-center body-text"></p>
    </div>

    <button onclick="handleResetClick()" class="btn-font bg-indigo-600 text-white uppercase shadow-xl btn-text flex-shrink-0">NEW MISSION</button>
  </div>
</div>

<script>
const clickAudio = new Audio("data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YTdvT18AZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA=");
let idleTimeout;
const IDLE_LIMIT = 3 * 60 * 1000;

function playClick() { clickAudio.currentTime = 0; clickAudio.play().catch(() => {}); }
function toggleFullScreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  else if (document.exitFullscreen) document.exitFullscreen();
}
function resetIdleTimer() {
  clearTimeout(idleTimeout);
  if (document.getElementById("start-screen").classList.contains("hidden")) {
    idleTimeout = setTimeout(() => { handleResetClick(); }, IDLE_LIMIT);
  }
}
['mousedown', 'mousemove', 'keypress', 'scroll', 'touchstart'].forEach(evt => {
  document.addEventListener(evt, resetIdleTimer, true);
});

const allQuestions = [
  {q: "Someone says a 'vape' is just flavored steam. What's the truth?", o: ["It has harmful chemicals.", "It's just water vapor."], c: 0, e: "💨", advice: "Vapes contain nicotine that hurts your growing brain."},
  {q: "A friend offers you a pill to help you study. What do you do?", o: ["Say no and tell an adult.", "Take it if I'm tired."], c: 0, e: "💊", advice: "Only take medicine from parents or doctors."},
  {q: "What's the best way to handle peer pressure to try drugs?", o: ["Be Brave and say 'No Thanks!'", "Do it just once."], c: 0, e: "💪", advice: "True leaders say 'No' to stay safe and in control."},
  {q: "Why is your brain so important right now?", o: ["It's still growing and learning.", "It's already finished growing."], c: 0, e: "🧠", advice: "Your brain is still developing—keep it free from glitches."},
  {q: "You find colorful stuff that looks like candy on the ground. Plan?", o: ["Leave it and alert a teacher.", "Eat it—it looks tasty!"], c: 0, e: "🍬", advice: "Never eat things found on the ground."},
  {q: "What happens to sports skills if someone uses drugs?", o: ["They get slower and clumsy.", "They become faster."], c: 0, e: "⚽", advice: "Drugs make your body slow and weak."},
  {q: "Older kids say vaping is 'cool'. Is it?", o: ["No, it's a bad habit.", "Yes, everyone does it."], c: 0, e: "🛑", advice: "Being in control is much cooler than being hooked on a vape."},
  {q: "How do drugs affect your future goals?", o: ["They make goals harder to reach.", "They help you reach them."], c: 0, e: "🚀", advice: "Stay clear-headed to reach your biggest dreams!"},
  {q: "If someone asks you to keep a 'drug secret', what do you do?", o: ["Tell a trusted adult.", "Keep the secret."], c: 0, e: "🗣️", advice: "Safety is never a secret. Always tell a trusted adult."},
  {q: "What is safe and fun?!", o: ["Sports, art, and music.", "Trying mystery smoke."], c: 0, e: "🎨", advice: "Hobbies like sports and art give you a healthy happy feeling."},
  {q: "Feeling stressed or sad? What's a smart move?", o: ["Talk to a parent or teacher.", "Try drugs to forget."], c: 0, e: "🫂", advice: "Talking about your feelings is your real strength."},
  {q: "What does nicotine do to your body?", o: ["It's addictive and tricks you.", "It makes you smarter."], c: 0, e: "🔗", advice: "Nicotine tries to hook your brain. Stay free!"},
  {q: "A healthy heart beats best with...", o: ["Fresh air and exercise.", "Vaping and pills."], c: 0, e: "🫀", advice: "Fresh air keeps your heart engine running strong."},
  {q: "Best 'food' for your brain?", o: ["Reading and puzzles.", "Energy drinks."], c: 0, e: "📚", advice: "Learning builds brain power more than any drug could."},
  {q: "Your lungs are like...", o: ["Pink sponges for air.", "Metal tubes."], c: 0, e: "🫁", advice: "Lungs need clean air. Smoke and vapes clog them."},
  {q: "Who is in charge of your body?", o: ["I am!", "People offering items."], c: 0, e: "👑", advice: "You're the captain of your body. Stay in charge!"},
  {q: "How does smoking change your breath and teeth?", o: ["Bad breath and yellow teeth.", "White teeth."], c: 0, e: "🤢", advice: "Smoking stains your smile and causes bad breath."}
];

let gameQuestions = [], currentQ = 0, score = 0, missedAdviceList = [];
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function handleStartClick() { playClick(); startGame(); resetIdleTimer(); }
function handleAnswerClick(i) { playClick(); checkAnswer(i); resetIdleTimer(); }
function handleResetClick() { playClick(); location.reload(); }
function startGame() {
  gameQuestions = shuffle([...allQuestions]).slice(0, 10);
  currentQ = score = 0; missedAdviceList = [];
  document.getElementById("start-screen").classList.add("hidden");
  document.getElementById("end-screen").classList.add("hidden");
  document.getElementById("question-screen").classList.remove("hidden");
  showQuestion();
}
function showQuestion() {
  const data = gameQuestions[currentQ];
  document.getElementById("question-text").innerText = data.q;
  document.getElementById("btn-0").innerText = data.o[0];
  document.getElementById("btn-1").innerText = data.o[1];
  document.getElementById("q-emoji").innerText = data.e;
  document.getElementById("progress-text").innerText = `Mission ${currentQ + 1}/10`;
  document.getElementById("progress-bar").style.width = `${(currentQ + 1) * 10}%`;
}
function checkAnswer(i) {
  const data = gameQuestions[currentQ];
  if (i === data.c) { score++; } else { missedAdviceList.push(data.advice); }
  currentQ++;
  if (currentQ < 10) showQuestion();
  else showEnd();
}
function showEnd() {
  document.getElementById("question-screen").classList.add("hidden");
  document.getElementById("end-screen").classList.remove("hidden");
  document.getElementById("final-score").innerText = score;
  const advicePara = document.getElementById("dynamic-advice");
  const endEmoji = document.getElementById("end-emoji");
  const advice = missedAdviceList[0] || "Your brain is your most powerful tool!";
  if (score >= 8) {
    endEmoji.innerText = "⭐";
    advicePara.innerText = `Outstanding Hero! You are so close to perfection. Remember: ${advice} Make it even better by staying focused!`;
  } else if (score >= 6) {
    endEmoji.innerText = "💪";
    let name = score === 6 ? "Friend" : "Hero"; 
    advicePara.innerText = `${name}, this is good enough, but you can do better! Keep this in mind: ${advice}. Aim for a perfect 10 next time!`;
  } else {
    endEmoji.innerText = "⚡";
    advicePara.innerText = `Keep pushing! Practice makes us stronger. Remember: ${advice}. Your brain deserves to stay strong!`;
  }
}
</script>
</body>
</html>
